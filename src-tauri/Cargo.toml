[package]
name = "codeneo-lite"
version = "0.1.7"
edition.workspace = true
rust-version = "1.96"
license.workspace = true
description = "codeneo-lite"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
claudekeeper-app = { path = "../crates/app" }
claudekeeper-claude = { path = "../crates/claude" }
claudekeeper-net = { path = "../crates/net" }
dirs = "7"
dunce = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
memchr = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml_edit = { version = "0.25.18", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell"] }
